<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登录 - gen Music</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-l4UPAMHGzl7zwogLW4nOwaU2XTk6oiM1jhCRQstZEndoIiA2I5bg6fST3wzBSRBD" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='css/app.css', v='1.0') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/auth.css', v='1.0') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/theme-init.js', v='1.5') }}"></script>
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="login-title">
            <div class="auth-brand"><span class="brand-mark"><i class="bi bi-soundwave"></i></span><span><small>gen Music</small><strong>Web 控制台</strong></span></div>
            <div class="auth-heading"><h1 id="login-title">登录控制台</h1><p>使用管理员创建的本地 Web 账号进入控制面。音乐平台 Cookie、Bot Token 与 Web 登录密码互相独立。</p></div>
            {% if error %}<div class="auth-alert mt-3">{{ error }}</div>{% endif %}
            <form method="post" class="auth-form" autocomplete="on">
                <div><label for="username">用户名</label><input class="form-control" id="username" name="username" required maxlength="32" autocomplete="username" autofocus></div>
                <div><label for="password">密码</label><input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"></div>
                <button class="auth-submit" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i>登录</button>
            </form>
            <div class="auth-note"><strong>安全提示</strong><br>初始管理员首次登录后必须立即修改临时密码。公网部署时请启用 HTTPS，并将 <code>AUTH_COOKIE_SECURE</code> 设置为 <code>true</code>。</div>
        </section>
    </main>
</body>
</html>
