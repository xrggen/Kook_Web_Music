name: Platform Sync

on:
  push:
    paths:
      - 'windows/**'
      - 'Ubuntu/**'
      - 'scripts/check_platform_sync.py'
      - 'scripts/check_secrets.py'
      - '.github/workflows/platform-sync.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'Ubuntu/**'
      - 'scripts/check_platform_sync.py'
      - 'scripts/check_secrets.py'
      - '.github/workflows/platform-sync.yml'

jobs:
  verify-shared-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and reachable history for secrets
        run: python scripts/check_secrets.py
      - name: Verify Windows and Ubuntu stay aligned
        run: python scripts/check_platform_sync.py
      - name: Compile Python sources
        run: python -m compileall -q windows Ubuntu scripts

  runtime-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_dir: Ubuntu
          - os: windows-latest
            platform_dir: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ matrix.platform_dir }}/requirements.txt"
      - name: Run platform stability tests
        run: python -m unittest discover -s "${{ matrix.platform_dir }}/tests" -p "test_*.py"
